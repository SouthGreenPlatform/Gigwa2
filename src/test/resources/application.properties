#spring.data.mongodb.host=localhost
#spring.data.mongodb.port=27017

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.url=/rest/v3/api-docs
springdoc.swagger-ui.path=/rest/swagger-ui.html

spring.mail.default-encoding=UTF-8
spring.mail.host=
spring.mail.port=
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=false

# to avoid error due to beans cycle
spring.main.allow-circular-references=true


spring.jackson.default-property-inclusion=non_null

spring.mvc.servlet.path=/

spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.enabled=true

#logging.level.root=DEBUG

# Definition of a host running remotely without authentication enabled, with a custom max-pool-size
mongo.hosts.defaultMongoHost.uri=mongodb://127.0.0.1:27017
mongo.hosts.defaultMongoHost.max-pool-size=500

